head_teleop_node:
  ros__parameters:
    # PS4 /dev/input/js0 typical mapping on Linux:
    # axis 0: left stick horizontal (left = -1, right = +1)
    # axis 1: left stick vertical (up = -1, down = +1)
    pan_axis: 0
    tilt_axis: 1

    # Inversion to make "up" = positive tilt, etc.
    invert_pan: false
    invert_tilt: false

    # TODO: replace with your actual joint limits (deg)
    # Limits: servo hard limit minus 2 deg (hros5_dynamixel_joints_with_limits.yaml); checked by check_joint_limits.py
    pan_max_deg: 88.0     # servo -90..+90
    tilt_max_deg: 19.8    # +-max; servo -21.8..+35.3, so the down side (-21.8) limits it

    deadzone: 0.05
    center_button: 3      # triangle on PS4
    echo_position_button: 0  # X on PS4
    echo_request_topic: /hros5/head/echo_positions

    publish_rate_hz: 20.0
