tracker_node:
  ros__parameters:
    # Realsense RGB topic used for tracking
    camera_topic: "/camera/realsense/color/image_raw"
    fov_h_deg: 69.0
    fov_v_deg: 42.0
    kp: 0.6
    # Tracker limits (degrees): servo hard limit minus 2 deg (pan -90..+90, tilt -21.8..+35.3)
    pan_min_deg: -88.0
    pan_max_deg: 88.0
    tilt_min_deg: -19.8
    tilt_max_deg: 33.3

head_dxl_node:
  ros__parameters:
    # Shared configs from hros5_control
    config_package: "hros5_control"
    config_file: "config/joints/head.yaml"
    bus_config: "config/dxl_bus.yaml"
    # Topics
    error_topic: "/hros5/head/target_angles_deg"
    echo_request_topic: "/hros5/head/echo_positions"
    # Servo behavior
    kp: 0.6          # retained for compatibility (not used internally)
    max_step_deg: 2.0
    invert_pan: false
    invert_tilt: false
    pan_offset_deg: 0.0
    tilt_offset_deg: 0.0
    # Safety limits (deg): servo hard limit minus 2 deg (hros5_control/config/hros5_dynamixel_joints_with_limits.yaml)
    pan_min_deg: -88.0
    pan_max_deg: 88.0
    tilt_min_deg: -19.8
    tilt_max_deg: 33.3
