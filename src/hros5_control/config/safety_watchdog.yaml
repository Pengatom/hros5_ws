/**:
  ros__parameters:
    pub_rate: 1.0
    base_path: hros5
    analyzers:
      controllers:
        type: diagnostic_aggregator/GenericAnalyzer
        path: controllers
        timeout: 5.0
        startswith:
          - "/controller_manager"
      hardware:
        type: diagnostic_aggregator/GenericAnalyzer
        path: hardware
        timeout: 5.0
        contains:
          - "dynamixel"
